name: Verify build

permissions:
  contents: write

concurrency:
  group: verify-build-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, fix/data-integrity-postgres-import]
  push:
    branches: [fix/data-integrity-postgres-import]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Build PocketBase Liara image
        run: docker build --file Dockerfile.pocketbase --tag khodroyar-pocketbase:ci .
