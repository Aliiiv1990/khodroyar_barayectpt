name: Verify build

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/data-integrity-postgres-import]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
