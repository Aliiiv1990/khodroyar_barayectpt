name: Verify build

permissions:
  contents: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/data-integrity-postgres-import]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Commit refreshed Bun lockfile
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: refresh Bun lockfile"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - run: bun run lint
      - run: bun run test
      - run: bun run build
