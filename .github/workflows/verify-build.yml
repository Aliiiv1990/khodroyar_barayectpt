name: Verify build

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/data-integrity-postgres-import]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      - run: bun run test
      - run: bun run build
